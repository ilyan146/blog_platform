[project]
name = "blog-platform"
version = "0.1.0"
description = "Dev meta-project: installs the whole platform into one environment."
requires-python = ">=3.11"
dependencies = [
    "blog_ai_agent",
    "blog-platform-backend",
]

# Test/lint tooling for the combined local environment.
[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "aiosqlite>=0.20",
    "ruff>=0.4",
]

[tool.uv]
package = false   # root is a workspace aggregator, not an installable package

[tool.uv.workspace]
members = ["backend", "packages/blog_ai_agent"]

[tool.uv.sources]
blog_ai_agent = { workspace = true }
blog-platform-backend = { workspace = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests", "packages/blog_ai_agent/tests"]
