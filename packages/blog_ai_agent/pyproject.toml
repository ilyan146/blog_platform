[project]
name = "blog_ai_agent"
version = "0.1.0"
description = "AI agent that writes 5-minute-read blog posts using Pydantic AI + Azure AI Foundry."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pydantic-ai>=0.0.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["blog_ai_agent"]
